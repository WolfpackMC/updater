name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --verbose --release

    - name: Run tests
      run: cargo test --verbose

    - name: Upload mcupdater artifact
      uses: actions/upload-artifact@v4
      with:
        name: mcupdater-${{ matrix.name }}
        path: |
          target/release/mcupdater
          target/release/mcupdater.exe
        if-no-files-found: ignore

    - name: Upload deploy artifact
      uses: actions/upload-artifact@v4
      with:
        name: deploy-${{ matrix.name }}
        path: |
          target/release/deploy
          target/release/deploy.exe
        if-no-files-found: ignore
