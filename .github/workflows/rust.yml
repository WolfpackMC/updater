name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --verbose --release

    - name: Run tests
      run: cargo test --verbose

    - name: Upload wolfpacker artifact
      uses: actions/upload-artifact@v4
      with:
        name: wolfpacker-${{ matrix.name }}
        path: |
          target/release/wolfpacker
          target/release/wolfpacker.exe
        if-no-files-found: ignore

    - name: Upload deploy artifact
      uses: actions/upload-artifact@v4
      with:
        name: deploy-${{ matrix.name }}
        path: |
          target/release/deploy
          target/release/deploy.exe
        if-no-files-found: ignore

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Windows wolfpacker artifact
      uses: actions/download-artifact@v4
      with:
        name: wolfpacker-windows
        path: dist

    - name: Download Linux wolfpacker artifact
      uses: actions/download-artifact@v4
      with:
        name: wolfpacker-linux
        path: dist

    - name: Download macOS wolfpacker artifact
      uses: actions/download-artifact@v4
      with:
        name: wolfpacker-macos
        path: dist-macos

    - name: Rename release assets
      run: |
        mv dist/wolfpacker.exe dist/wolfpacker-windows.exe
        mv dist/wolfpacker dist/wolfpacker-linux
        mv dist-macos/wolfpacker dist/wolfpacker-macos
        chmod +x dist/wolfpacker-linux dist/wolfpacker-macos

    - name: Publish rolling latest release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: Latest build
        prerelease: true
        body: Automatically updated build from the latest main branch commit.
        files: |
          dist/wolfpacker-windows.exe
          dist/wolfpacker-linux
          dist/wolfpacker-macos
