[package]
name = "mcupdater"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = {version = "0.13.3", features = ["blocking"]}
anyhow = "1.0.102"
zip = "8.6.0"
indicatif = "0.18.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aws-sdk-s3 = "1"
aws-config = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
walkdir = "2"
md-5 = "0.10"
dotenvy = "0.15"
rayon = "1"

